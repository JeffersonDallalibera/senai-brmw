<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="senaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005594" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
  </defs>
  
  <!-- Ícone estilizado de Banco de Dados e Conexões -->
  <g transform="translate(10, 10)">
    <!-- Cilindro de BD 1 -->
    <ellipse cx="40" cy="22" rx="28" ry="10" fill="url(#accentGrad)" />
    <path d="M 12 22 V 46 C 12 52 68 52 68 46 V 22" fill="url(#senaiGrad)" />
    <ellipse cx="40" cy="46" rx="28" ry="10" fill="#0066AA" />
    
    <!-- Cilindro de BD 2 -->
    <path d="M 12 46 V 70 C 12 76 68 76 68 70 V 46" fill="url(#senaiGrad)" />
    <ellipse cx="40" cy="70" rx="28" ry="10" fill="#004488" />

    <!-- Nós de relacionamento relacional -->
    <circle cx="75" cy="25" r="5" fill="#10B981" />
    <circle cx="75" cy="55" r="5" fill="#F59E0B" />
    <line x1="68" y1="25" x2="75" y2="25" stroke="#10B981" stroke-width="2" />
    <line x1="68" y1="55" x2="75" y2="55" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- Tipografia do Título -->
  <text x="105" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#005594" letter-spacing="1">SENAI</text>
  <text x="215" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="32" fill="#64748B">|</text>
  <text x="230" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="30" fill="#0284C7">BRMW</text>
  <text x="106" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="2">GUIA INTERATIVO &amp; MODELADOR CONCEITUAL</text>
</svg>
